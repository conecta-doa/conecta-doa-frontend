<main class="flex-1 px-4 sm:px-6 lg:px-10 py-8">
  <div class="max-w-4xl mx-auto">
    <!-- Título + ações -->
    <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
      <p
        class="text-black text-4xl font-black leading-tight tracking-[-0.033em] min-w-72"
      >
        Notificações de Doação
      </p>

      <div class="flex gap-3 flex-wrap">
        <button
          type="button"
          class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em]"
          (click)="markAllAsRead()"
          [disabled]="!hasNotifications"
        >
          <span class="truncate">Marcar todas como lidas</span>
        </button>

        <button
          type="button"
          class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-gray-200 text-black text-sm font-bold leading-normal tracking-[0.015em]"
          (click)="clearNotifications()"
          [disabled]="!hasNotifications"
        >
          <span class="truncate">Limpar notificações</span>
        </button>
      </div>
    </div>

    <!-- Lista de notificações -->
    <div *ngIf="hasNotifications; else emptyState" class="space-y-4">
      <div
        *ngFor="let notif of notifications"
        class="flex items-center gap-4 bg-white p-4 rounded-xl shadow-sm hover:shadow-md transition-shadow"
      >
        <div class="flex items-center gap-4 flex-1">
          <!-- bolinha só se for nova -->
          <div
            class="w-1.5 h-1.5 rounded-full shrink-0"
            [ngClass]="notif.isNew ? 'bg-primary' : 'bg-transparent'"
          ></div>

          <div class="flex flex-col justify-center">
            <p class="text-black text-base font-medium leading-normal">
              {{ notif.message }}
            </p>
            <p class="text-gray-500 text-sm font-normal leading-normal">
              {{ notif.timeLabel }}
            </p>
          </div>
        </div>

        <!-- Botão some se já confirmado -->
        <button
          *ngIf="!notif.confirmed"
          type="button"
          class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-white text-primary border border-gray-200 text-sm font-bold leading-normal tracking-[0.015em] hover:bg-gray-100"
          (click)="confirm(notif)"
        >
          <span class="truncate">Confirmar Recebimento</span>
        </button>

        <span
          *ngIf="notif.confirmed"
          class="text-xs font-semibold text-green-600 px-3 py-1 rounded-full bg-green-50 border border-green-200"
        >
          Confirmado
        </span>
      </div>
    </div>

    <!-- Estado vazio -->
    <ng-template #emptyState>
      <div class="text-center py-16">
        <span class="material-symbols-outlined text-6xl text-gray-400">
          notifications_off
        </span>
        <p class="text-gray-500 mt-4 text-lg">
          Você não tem nenhuma notificação nova.
        </p>
      </div>
    </ng-template>
  </div>
</main>
